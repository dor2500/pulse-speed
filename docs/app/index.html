<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse</title>
<meta name="description" content="Pulse speed test in your browser: download, upload, ping, jitter and bufferbloat, with the same design as the Android app.">
<meta property="og:title" content="Pulse speed test">
<meta property="og:description" content="Test your internet speed, ping and bufferbloat. Same design as the Pulse Android app.">
<meta name="theme-color" content="#0E1514">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23006A6A'/%3E%3Cpath d='M4 12h3.5l2-5 4 10 2-5H20' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block">
<link rel="stylesheet" href="app.css?v=1.7.0">
<script>
  // Apply the saved theme before first paint so there's no flash.
  try {
    var s = JSON.parse(localStorage.getItem("pulse_web_settings") || "{}");
    var t = s.theme || "system";
    var dark = t === "dark" || t === "oled" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = t === "oled" ? "oled" : dark ? "dark" : "light";
  } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <clipPath id="scallop" clipPathUnits="objectBoundingBox"><path id="scallop-path"/></clipPath>
</svg>
<main id="app"></main>
<div class="nav-wrap"><nav class="nav" id="nav" role="tablist"></nav></div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js?v=1.7.0"></script>
</body>
</html>
